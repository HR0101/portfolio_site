<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="R and RH — single-contour flight studies"><title>R and RH — single-contour flight studies</title><rect width="1200" height="800" fill="#fafaf8"/><text x="64" y="58" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d1d1f">R / RH — FLIGHT STUDIES</text><text x="1058" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#737983">Ryuto Hara</text><path d="M64 88H1136" fill="none" stroke="#dedfdf"/><text x="64" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#737983">01   R / WING</text><text x="664" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#737983">02   RH / SHARED STROKES</text><g id="R-single-contour" transform="translate(110 176) scale(1.45)"><path id="R-flight-contour" fill="#396da9" fill-rule="evenodd" d="M26 224C41 182 53 136 55 98L25 32C63 54 98 72 126 78C114 61 104 40 101 21C142 41 176 66 191 90C213 120 214 146 187 164C202 184 222 205 243 224L185 224C160 209 141 188 122 168L79 168C74 188 67 209 61 224Z M94 100L85 144C120 149 153 140 152 124C151 112 124 103 94 100Z"/></g><g id="RH-single-contour" transform="translate(710 176) scale(1.45)"><path id="RH-flight-contour" fill="#396da9" fill-rule="evenodd" d="M24 218C37 181 46 137 49 100C41 78 31 55 20 34C60 48 104 60 129 84C144 98 150 116 141 132L174 132C170 103 163 70 158 38C184 61 211 94 223 124C232 128 239 134 244 142L232 144C227 155 221 164 210 170C204 190 199 205 194 218L166 218C177 198 185 180 190 160L125 160C130 183 139 202 151 218L117 218C99 201 87 182 76 161L65 161C62 181 57 201 50 218Z M73 91L69 135C90 139 114 130 113 116C112 104 91 94 73 91Z"/></g><text x="64" y="570" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1d1d1f">The upper bowl becomes two swept wings.</text><text x="64" y="597" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill