AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC access for publishing this portfolio only
Parameters:
  ExistingProviderArn:
    Type: String
    Default: ''
    Description: Existing GitHub OIDC provider ARN, if this account already has one
  GitHubSubject:
    Type: String
    Default: repo:HR0101@186650906/portfolio_site@1355510522:ref:refs/heads/main
  BucketName:
    Type: String
    Default: rhara-portfolio-sitebucket-n3hu448orwdn
  DistributionId:
    Type: String
    Default: EJZ7WFWK76LQZ
Conditions:
  CreateProvider: !Equals [!Ref ExistingProviderArn, '']
Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rhara-portfolio-github-publish
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubProvider, !Ref ExistingProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      Policies:
        - PolicyName: PublishExistingPortfolio
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/*'
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rhara-portfolio/*'
Outputs:
  RoleArn:
    Value: !GetAtt PublishRole.Arn
