    <g fill="#ffd3a0" opacity=".36"><rect x="30" y="210" width="115" height="8"/><rect x="66" y="202" width="54" height="8"/><rect x="250" y="160" width="98" height="8"/></g>
    <rect y="495" width="400" height="210" fill="url(#sunsetWater)"/>
    <g fill="#f3b971" opacity=".42"><rect x="18" y="550" width="130" height="5"/><rect x="220" y="590" width="120" height="5"/><rect x="90" y="650" width="190" height="5"/></g>
    <path d="M0 620h40v-8h24v12h32v-5h38v7h28v-14h38v10h32v-8h26v12h40v-8h34v9h38v-7h40v85H0z" fill="#5d4d5b" opacity=".9"/>
    <rect y="720" width="400" height="180" fill="url(#roadDither)"/>
    <g fill="#f2c87e" opacity=".76"><rect x="18" y="726" width="12" height="4"/><rect x="68" y="726" width="12" height="4"/><rect x="118" y="726" width="12" height="4"/><rect x="168" y="726" width="12" height="4"/><rect x="218" y="726" width="12" height="4"/><rect x="268" y="726" width="12" height="4"/><rect x="318" y="726" width="12" height="4"/><rect x="368" y="726" width="12" height="4"/></g>
    <g transform="translate(48 598)"><rect x="24" y="0" width="6" height="125" fill="#d9d4c8"/><rect x="0" y="0" width="54" height="38" rx="4" fill="#8eafbd" stroke="#29455e" stroke-width="5"/><rect x="10" y="10" width="34" height="5" fill="#29455e"/><rect x="17" y="20" width="20" height="5" fill="#29455e"/><rect x="13" y="125" width="28" height="8" fill="#4e4f59"/></g>
    <g fill="#fff0bc" opacity=".92"><rect x="304" y="344" width="24" height="24"/><rect x="296" y="352" width="40" height="8"/><rect x="312" y="336" width="8" height="40"/></g>
