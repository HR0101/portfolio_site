    <g fill="#fff5c9"><rect x="42" y="150" width="4" height="4"/><rect x="94" y="102" width="4" height="4"/><rect x="155" y="208" width="4" height="4"/><rect x="222" y="124" width="4" height="4"/><rect x="287" y="186" width="4" height="4"/><rect x="344" y="100" width="4" height="4"/><rect x="356" y="232" width="4" height="4"/><rect x="180" y="72" width="4" height="4"/></g>
