    <g transform="translate(48 598)"><rect x="24" y="0" width="6" height="125" fill="#eee9dc"/><rect x="0" y="0" width="54" height="38" rx="4" fill="#9cc7d9" stroke="#254d67" stroke-width="5"/><rect x="10" y="10" width="34" height="5" fill="#254d67"/><rect x="17" y="20" width="20" height="5" fill="#254d67"/><rect x="13" y="125" width="28" height="8" fill="#656b6e"/></g>
    <g fill="#fff8df"><rect x="300" y="94" width="28" height="28"/><rect x="292" y="102" width="44" height="12"/><rect x="308" y="86" width="12" height="44"/></g>
