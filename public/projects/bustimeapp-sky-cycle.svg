    <g fill="#8b85a2" opacity=".34"><rect x="22" y="546" width="130" height="4"/><rect x="230" y="585" width="108" height="4"/><rect x="88" y="638" width="170" height="4"/></g>
    <path d="M0 620h40v-8h24v12h32v-5h38v7h28v-14h38v10h32v-8h26v12h40v-8h34v9h38v-7h40v85H0z" fill="#22283e" opacity=".96"/>
    <g fill="#ffd47b"><rect x="38" y="625" width="5" height="5"/><rect x="101" y="642" width="5" height="5"/><rect x="184" y="632" width="5" height="5"/><rect x="286" y="650" width="5" height="5"/><rect x="342" y="628" width="5" height="5"/></g>
    <rect y="720" width="400" height="180" fill="url(#roadDither)"/>
    <g fill="#e8d59b" opacity=".72"><rect x="18" y="726" width="12" height="4"/><rect x="68" y="726" width="12" height="4"/><rect x="118" y="726" width="12" height="4"/><rect x="168" y="726" width="12" height="4"/><rect x="218" y="726" width="12" height="4"/><rect x="268" y="726" width="12" height="4"/><rect x="318" y="726" width="12" height="4"/><rect x="368" y="726" width="12" height="4"/></g>
    <g transform="translate(48 598)"><rect x="24" y="0" width="6" height="125" fill="#d7d9de"/><rect x="0" y="0" width="54" height="38" rx="4" fill="#5f7790" stroke="#d2d2ce" stroke-width="5"/><rect x="10" y="10" width="34" height="5" fill="#e7dba7"/><rect x="17" y="20" width="20" height="5" fill="#e7dba7"/><rect x="13" y="125" width="28" height="8" fill="#313746"/></g>
    <g fill="#fff1c0"><rect x="302" y="154" width="20" height="20"/><rect x="294" y="162" width="36" height="4"/><rect x="310" y="146" width="4" height="36"/></g>
    <rect x="20" y="24" width="360" height="64" rx="16" fill="#050917" opacity=".38"/>
    <text x="40" y="54" class="label" fill="#f4f5ff" font-size="15">NIGHT</text><text x="40" y="76" class="label" fill="#f4f5ff" font-size="12" opacity=".78">21:00  ·  月明かりと星</text>
