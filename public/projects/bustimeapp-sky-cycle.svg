<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BusTimeApp 時刻連動の空</title>
  <desc id="desc">夜明け、昼、夕暮れ、夜で色と光が変わるBusTimeAppのドット絵背景。</desc>
  <defs>
    <linearGradient id="dawnSky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#555694"/><stop offset=".58" stop-color="#be7e86"/><stop offset="1" stop-color="#fcae67"/></linearGradient>
    <linearGradient id="daySky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5fa5ea"/><stop offset=".62" stop-color="#a9d9f3"/><stop offset="1" stop-color="#d9effd"/></linearGradient>
    <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e17b4f"/><stop offset=".56" stop-color="#ef9a5e"/><stop offset="1" stop-color="#fee2a1"/></linearGradient>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0e1234"/><stop offset=".58" stop-color="#252a58"/><stop offset="1" stop-color="#3b4071"/></linearGradient>
    <linearGradient id="dawnWater" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#536e89"/><stop offset="1" stop-color="#29465c"/></linearGradient>
    <linearGradient id="dayWater" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5e9bb1"/><stop offset="1" stop-color="#235766"/></linearGradient>
    <linearGradient id="sunsetWater" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a56c65"/><stop offset="1" stop-color="#533f54"/></linearGradient>
    <linearGradient id="nightWater" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#222c52"/><stop offset="1" stop-color="#101c35"/></linearGradient>
    <pattern id="roadDither" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#343943"/><rect width="4" height="4" fill="#3e424a"/><rect x="8" y="8" width="4" height="4" fill="#292e37"/></pattern>
    <style>
      .pixel { shape-rendering: crispEdges; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; letter-spacing: 1.4px; }
    </style>
  </defs>

  <!-- 夜明け -->
  <g transform="translate(0 0)" class="pixel">
    <rect width="400" height="900" fill="url(#dawnSky)"/>
    <g fill="#f9d6bb" opacity=".55"><rect x="30" y="180" width="92" height="8"/><rect x="70" y="172" width="42" height="8"/><rect x="272" y="260" width="80" height="8"/><rect x="300" y="252" width="44" height="8"/></g>
    <rect y="495" width="400" height="210" fill="url(#dawnWater)"/>
    <g fill="#e8b179" opacity=".38"><rect x="40" y="546" width="120" height="4"/><rect x="230" y="585" width="110" height="4"/><rect x="90" y="638" width="170" height="4"/></g>
    <path d="M0 620h40v-8h24v12h32v-5h38v7h28v-14h38v10h32v-8h26v12h40v-8h34v9h38v-7h40v85H0z" fill="#53606f" opacity=".85"/>
    <rect y="720" width="400" height="180" fill="url(#roadDither)"/>
    <g fill="#c6bda8" opacity=".7"><rect x="18" y="726" width="12" height="4"/><rect x="68" y="726" width="12" height="4"/><rect x="118" y="726" width="12" height="4"/><rect x="168" y="726" width="12" height="4"/><rect x="218" y="726" width="12" height="4"/><rect x="268" y="726" width="12" height="4"/><rect x="318" y="726" width="12" height="4"/><rect x="368" y="726" width="12" height="4"/></g>
