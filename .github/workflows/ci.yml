name: CI / CD

# main への push と Pull Request で，型・lint・ビルド・E2E テストを通す
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_PUBLIC_SITE_URL: https://hr0101.dev
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: 品質チェック
        run: npm run check

      - name: 公開用の静的ビルド
        run: npm run build:static
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 公開URLと出力ファイルの検証
        run: npm run deploy:aws:check

      - name: 検証済み成果物を保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portfolio-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 7

      - name: AWS接続未設定時の案内
        if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN == ''
        run: echo 'CIは完了しました。CDはAWSのOIDCロールとリポジトリ変数 AWS_DEPLOY_ROLE_ARN の設定待ちです。DEPLOY.md を参照してください。' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to AWS
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: portfolio-aws-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portfolio-${{ github.sha }}
          path: out/
      - name: AWSへのOIDC認証
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: '061534656994'
          role-session-name: portfolio-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: S3アップロード・キャッシュ更新・公開HTTP検証
        run: npm run deploy:aws:publish
        env:
          AWS_REGION: ap-southeast-2
          AWS_STACK_NAME: rhara-portfolio
      - name: 公開結果
        run: echo '公開サイト https://hr0101.dev/ （commit ${{ github.sha }}）' >> "$GITHUB_STEP_SUMMARY"
