name: CI

# main への push と Pull Request で，型・lint・ビルド・E2E テストを通す
# 公開は Cloudflare Pages の Git 連携が行う（同じ検証をビルドコマンドの中でも実行する）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_PUBLIC_SITE_URL: https://hr0101.dev
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: 品質チェック
        run: npm run check

      - name: 公開用の静的ビルド
        run: npm run build:static
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 公開URLと出力ファイルの検証
        run: npm run deploy:aws:check
